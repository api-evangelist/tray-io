aid: tray-io
name: Tray.io
description: >-
  Tray.io (now also known as Tray.ai) is an AI-ready integration platform as a service (iPaaS) that enables businesses
  to integrate and automate workflows across cloud applications using a visual editor, pre-built connectors, and
  API-level access. The platform includes Merlin Agent Builder for building AI agents and a Universal Automation Cloud
  for connecting data and systems.
